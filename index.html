    /* 1. Global Variables */
    :root {
      --bg-primary: #0d1117;
      --bg-card: rgba(88, 166, 255, 0.06);
      --text-primary: #f0f6fc;
      --text-secondary: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-light: #79c0ff;
      --border-color: rgba(88, 166, 255, 0.1);
      --max-width: 1100px;
    }

    /* 2. CSS Reset */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 3. Global Typography & Base Styles */
    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-secondary);
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, h5, h6 {
      color: var(--text-primary);
      line-height: 1.1;
      margin-bottom: 1rem;
    }

    /* 4. Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    section {
      animation: fadeIn 0.6s ease-out;
    }
  </style>
